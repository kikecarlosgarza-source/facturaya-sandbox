services:
  - type: web
    name: facturasat-backend
    env: docker
    plan: starter
    disk:
      name: db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CAPSOLVER_API_KEY
        sync: false
      - key: ADMIN_AUDIT_TOKEN
        sync: false
      - key: DB_DIR
        value: /data
